<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Night Chase</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; font-family: 'Courier New', ui-monospace, Menlo, Consolas, monospace; color: #e0ffe0; }

  /* La página es una columna: escenario 3D arriba y, en pantallas táctiles, una franja de controles abajo (nada se superpone). */
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #canvas-container { position: absolute; inset: 0; }
  #canvas-container canvas { display: block; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(circle, transparent 45%, rgba(0,0,0,0.85) 100%); pointer-events: none; z-index: 5; }

  /* Paneles (sin backdrop-filter: desenfocar encima de WebGL en cada cuadro es carísimo en celulares) */
  .glass { background: rgba(8, 20, 16, 0.55); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; }

  #hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  #top-hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: stretch; justify-content: space-between; }
  .hud-panel { padding: 6px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 64px; }
  .hud-label { font-size: 9px; color: rgba(255,255,255,0.8); letter-spacing: 2px; margin-bottom: 2px; }
  .hud-value { font-size: 22px; font-weight: bold; text-shadow: 0 0 8px rgba(0,255,65,0.8); }
  #status-val { font-size: 13px; color: #00ff41; }
  #pause-btn { pointer-events: auto; width: 40px; padding: 0; font-size: 16px; color: #fff; font-family: inherit; cursor: pointer; }

  #life-panel { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px 10px; }
  .life-pip { width: 14px; height: 6px; background: #00ff41; box-shadow: 0 0 5px #00ff41; }
  .life-pip.lost { background: rgba(255,0,0,0.25); box-shadow: none; }

  #cheat-list { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); text-align: right; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 11px; }
  .cheat-code { color: #ff0; font-weight: bold; }
  #cheat-indicator { position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%); color: #000; font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.9); padding: 4px 10px; opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #mobile-cheat-trigger { display: none; position: absolute; top: 96px; right: 10px; padding: 6px 12px; font-size: 11px; color: #fff; font-family: inherit; pointer-events: auto; }
  #collision-warn { position: absolute; top: 24%; left: 50%; transform: translate(-50%, -50%); color: #f05; text-shadow: 0 0 20px #f05; font-size: 26px; font-weight: bold; display: none; text-align: center; white-space: nowrap; }

  #dashboard { position: absolute; bottom: 10px; left: 10px; display: flex; align-items: flex-end; gap: 10px; padding: 8px 10px; }
  .gauge { width: 58px; height: 58px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.3); border-top-color: #00ff41; border-right-color: #00ff41; display: flex; align-items: center; justify-content: center; transform: rotate(-45deg); }
  .gauge-inner { transform: rotate(45deg); text-align: center; }
  .gauge .hud-value { font-size: 17px; }
  #nitro-bar { width: 110px; height: 8px; border: 1px solid #00ff41; background: rgba(0,0,0,0.3); overflow: hidden; margin-top: 3px; }
  #nitro-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #004d00, #00ff41, #fff); transform-origin: left; }
  #weapon-system { position: absolute; bottom: 10px; right: 10px; padding: 8px 10px; text-align: right; }
  .ammo-pip { display: inline-block; width: 9px; height: 18px; background: #00ff41; margin-left: 3px; box-shadow: 0 0 5px #00ff41; }
  .ammo-pip.empty { background: rgba(0,0,0,0.35); box-shadow: none; }

  /* Franja de controles táctiles */
  #bar { display: none; height: 104px; flex: none; background: #0b1514; border-top: 1px solid rgba(255,255,255,0.15); align-items: center; justify-content: space-between; padding: 0 12px; gap: 8px; }
  body.touch #bar { display: flex; }
  body.touch #mobile-cheat-trigger { display: block; }
  body.touch #cheat-list { display: none; }
  .group { display: flex; gap: 12px; align-items: center; }
  .btn { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-family: inherit; touch-action: none; }
  .btn.down { background: rgba(0,255,65,0.4); transform: scale(0.95); }
  .btn.boost { width: 80px; height: 80px; font-size: 12px; color: #0ff; border-color: #0ff; }
  .btn.fire { font-size: 12px; color: #f05; border-color: #f05; }

  /* Pantallas: inicio, pausa, fin */
  .screen { position: absolute; inset: 0; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(0,0,0,0.6); padding: 20px; gap: 10px; }
  .screen.on { display: flex; }
  .title { font-size: 40px; font-weight: bold; color: #0ff; text-shadow: 0 0 24px rgba(0,255,255,0.8); transform: skewX(-10deg); letter-spacing: 3px; }
  .title.bad { color: #f05; text-shadow: 0 0 30px rgba(255,0,85,0.8); font-size: 34px; }
  .sub { color: #cfe; font-size: 13px; letter-spacing: 2px; }
  .record { color: #fd5; font-size: 14px; }
  .go-btn { margin-top: 14px; padding: 16px 34px; color: #fff; font-family: inherit; font-size: 16px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; background: rgba(0,255,65,0.25); border: 1px solid #00ff41; border-radius: 6px; }

  #mobile-cheat-panel { display: none; position: absolute; inset: 0; z-index: 150; background: rgba(0,0,0,0.88); flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #mobile-cheat-input { background: rgba(0,0,0,0.5); border: 2px solid #00ff41; color: #00ff41; padding: 12px; font-size: 18px; font-family: inherit; width: 80%; max-width: 360px; text-transform: uppercase; text-align: center; outline: none; }
  #close-mobile-cheat { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 26px; font-family: inherit; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="canvas-container"></div>
    <div class="vignette"></div>

    <div id="hud">
      <div id="top-hud">
        <button id="pause-btn" class="glass hud-panel" aria-label="Pause">II</button>
        <div class="hud-panel glass"><div class="hud-label" data-t="DISTANCIA">DISTANCE</div><div class="hud-value" id="score-val">0</div></div>
        <div class="hud-panel glass"><div class="hud-label" data-t="SISTEMA">SYSTEM</div><div class="hud-value" id="status-val" data-t="EN LÍNEA">ONLINE</div></div>
        <div class="hud-panel glass"><div class="hud-label" data-t="TIEMPO">TIME</div><div class="hud-value" style="font-size:16px"><span id="time-val">0.0</span>s</div></div>
      </div>
      <div id="life-panel" class="glass"><div class="life-pip"></div><div class="life-pip"></div><div class="life-pip"></div><div class="life-pip"></div><div class="life-pip"></div><div class="life-pip"></div></div>
      <div id="cheat-list" class="glass">
        <div>GOD MODE: <span class="cheat-code">SHIELD</span></div>
        <div>INF NITRO: <span class="cheat-code">TURBO</span></div>
        <div>CHAOS: <span class="cheat-code">CHAOS</span></div>
      </div>
      <button id="mobile-cheat-trigger" class="glass">CHEAT</button>
      <div id="dashboard" class="glass">
        <div class="gauge"><div class="gauge-inner"><div id="speed-val" class="hud-value">0</div><div class="hud-label" style="margin:0">MPH</div></div></div>
        <div><div class="hud-label">NITRO</div><div id="nitro-bar"><div id="nitro-fill"></div></div></div>
      </div>
      <div id="weapon-system" class="glass"><div class="hud-label">DISC</div><div id="ammo-container"></div></div>
      <div id="cheat-indicator">CHEAT ACTIVATED</div>
      <div id="collision-warn" data-t="IMPACTO DETECTADO">IMPACT DETECTED</div>
    </div>

    <div id="start-screen" class="screen on">
      <div class="title">NIGHT CHASE</div>
      <div class="sub" data-t="PERSECUCIÓN NOCTURNA">NIGHT CITY PURSUIT</div>
      <div class="sub" id="start-best"></div>
      <button class="go-btn" id="start-btn" data-t="Tocá para empezar">Tap to start</button>
    </div>
    <div id="pause-screen" class="screen">
      <div class="title" data-t="PAUSA">PAUSED</div>
      <button class="go-btn" id="resume-btn" data-t="Continuar">Resume</button>
    </div>
    <div id="game-over-screen" class="screen">
      <div class="title bad" data-t="FALLA CRÍTICA">CRITICAL FAILURE</div>
      <div class="sub" data-t="CASCO DESTRUIDO">HULL INTEGRITY ZERO</div>
      <div class="sub" id="go-score"></div>
      <div class="record" id="go-record"></div>
      <button class="go-btn" id="restart-btn" data-t="REINICIAR">REBOOT SYSTEM</button>
    </div>

    <div id="mobile-cheat-panel">
      <div class="hud-label">TYPE CHEAT CODE</div>
      <input type="text" id="mobile-cheat-input" placeholder="SHIELD / TURBO / CHAOS" autocomplete="off">
      <button id="close-mobile-cheat">CLOSE</button>
    </div>
  </div>

  <div id="bar">
    <div class="group"><div class="btn" data-key="left">&#9664;</div><div class="btn" data-key="right">&#9654;</div></div>
    <div class="group"><div class="btn fire" data-key="fire" data-t="DISPARAR">FIRE</div><div class="btn boost" data-key="boost">NITRO</div></div>
  </div>
</div>
<!--__SCRIPTS__-->
</body>
</html>
