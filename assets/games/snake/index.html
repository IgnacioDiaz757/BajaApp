<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #070b16;
    --panel: #0f172a;
    --border: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #4ade80;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 10%, rgba(74, 222, 128, 0.12), transparent 40%), radial-gradient(circle at 80% 90%, rgba(56, 189, 248, 0.1), transparent 45%), var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  .scores { display: flex; gap: 10px; }
  .score { min-width: 96px; padding: 6px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); text-align: center; }
  .score small { display: block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .score strong { display: inline-block; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
  .score.bump strong { animation: bump 0.25s ease; }
  @keyframes bump { 50% { transform: scale(1.3); color: var(--accent); } }

  /* El tablero es cuadrado; JS fija también el alto por si el WebView no soporta aspect-ratio */
  .board { position: relative; width: min(calc(100vw - 32px), calc(100vh - 150px), 580px); aspect-ratio: 1; border-radius: 18px; box-shadow: 0 0 0 1px var(--border), 0 30px 80px -20px rgba(74, 222, 128, 0.25); }
  canvas { display: block; width: 100%; height: 100%; border-radius: 18px; touch-action: none; }

  .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; border-radius: 18px; background: rgba(7, 11, 22, 0.45); }
  .overlay[hidden] { display: none; }
  .card { display: grid; gap: 12px; max-width: 340px; padding: 22px 26px; border-radius: 18px; border: 1px solid var(--border); background: rgba(15, 23, 42, 0.92); }
  .overlay h2 { margin: 0; font-size: clamp(1.6rem, 6vw, 2.4rem); }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; }
  .overlay.is-over h2 { color: var(--danger); }
  button { justify-self: center; margin-top: 6px; padding: 14px 32px; border: 0; border-radius: 999px; background: var(--accent); color: #052e16; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:active { transform: translateY(2px); }
  kbd { padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); font-size: 0.8em; }
  .hint { margin: 0; font-size: 0.85rem; color: var(--muted); text-align: center; }
  body.touch .desktop-only { display: none; }
  body:not(.touch) .touch-only { display: none; }
</style>
</head>
<body>
  <main>
    <div class="scores">
      <div class="score"><small data-t="Puntos">Puntos</small><strong id="score">0</strong></div>
      <div class="score"><small data-t="Récord">Récord</small><strong id="record">0</strong></div>
    </div>

    <div class="board" id="board">
      <canvas aria-label="Snake"></canvas>
      <div class="overlay">
        <div class="card">
          <h2 data-t="¿Preparado?">¿Preparado?</h2>
          <p data-t="Comé manzanas para crecer. No choques con las paredes ni con vos misma.">Comé manzanas para crecer. No choques con las paredes ni con vos misma.</p>
          <button data-t="Empezar">Empezar</button>
        </div>
      </div>
    </div>

    <p class="hint desktop-only"><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> o <kbd>WASD</kbd> para moverte · <kbd>Espacio</kbd> pausa</p>
    <p class="hint touch-only" data-t="Deslizá el dedo para moverte">Deslizá el dedo para moverte</p>
  </main>
<!--__SCRIPTS__-->
</body>
</html>
